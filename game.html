<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Mystery Journey: Horror</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music"
src="The Hollow Between.mp3"
loop preload="auto"></audio>

<div id="game">

<header class="game-top">
  <button id="menuBtn">☰</button>

  <div class="chapter">
    <small id="chapter">PROLOGUE</small>
    <span id="scene">00:00</span>
  </div>

  <button id="saveBtn">💾</button>
</header>

<main class="story">

  <div class="location">
    <span id="location">BLACKWOOD</span>
  </div>

  <section class="story-box">

    <div id="speaker"></div>

    <div id="text"></div>

    <button id="next">
      CONTINUER
    </button>

  </section>

  <section id="choices" class="choices"></section>

  <aside class="status">
    <div>
      <span>🔎 Indices</span>
      <b id="clues">0</b>
    </div>

    <div>
      <span>🎒 Objets</span>
      <b id="items">0</b>
    </div>
  </aside>

</main>

<div id="fade"></div>

<div id="pause" hidden>
  <div class="pause-box">

    <h2>PAUSE</h2>

    <button id="resume">REPRENDRE</button>
    <button id="savePause">SAUVEGARDER</button>
    <button id="quit">MENU PRINCIPAL</button>

  </div>
</div>

<div id="notification"></div>

</div>

<script src="save.js"></script>
<script src="story.js"></script>
<script src="game.js"></script>

</body>
</html>

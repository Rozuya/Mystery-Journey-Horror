<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Mystery Journey: Horror</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

<header class="game-header">
  <div>
    <small id="chapter">PROLOGUE</small>
    <h1 id="location">BLACKWOOD</h1>
  </div>

  <button id="saveBtn" class="small-btn">💾</button>
</header>

<main>

<div id="storyBox" class="story-box">

  <div id="time" class="story-time"></div>

  <div id="speaker" class="speaker"></div>

  <div id="storyText" class="story-text"></div>

  <div id="choices" class="choices"></div>

</div>

<div class="status">

  <div>
    <span>Indices</span>
    <b id="clueCount">0</b>
  </div>

  <div>
    <span>Objets</span>
    <b id="itemCount">0</b>
  </div>

  <div>
    <span>Progression</span>
    <b id="progress">0%</b>
  </div>

</div>

</main>

<footer>

  <button id="menuBtn" class="small-btn">
    ☰ Menu
  </button>

  <div class="music">
    🎵
    <input id="volume" type="range" min="0" max="100" value="45">
    <span id="volumeValue">45%</span>
  </div>

</footer>

</div>

<div id="ending" class="ending hidden">

  <div class="ending-card">

    <div id="endingIcon">🕵️</div>

    <h2 id="endingTitle"></h2>

    <p id="endingText"></p>

    <div class="ending-actions">
      <button id="restartBtn">Nouvelle partie</button>
      <button id="againBtn">Rejouer</button>
    </div>

  </div>

</div>

<div id="toast"></div>

<audio id="music" loop preload="auto">
  <source src="The Hollow Between.mp3" type="audio/mpeg">
</audio>

<script src="save.js"></script>

<script src="story/prologue.js"></script>
<script src="story/chapter1.js"></script>
<script src="story/chapter2.js"></script>
<script src="story/chapter3.js"></script>
<script src="story/chapter4.js"></script>
<script src="story/chapter5.js"></script>

<script src="game.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Mystery Journey: Horror</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

<header class="game-header">
<div>
<small>MYSTERY JOURNEY</small>
<h1>HORROR</h1>
</div>
</header>

<main>

<section class="story-box">

<div class="story-time">
UNE HISTOIRE COMMENCE...
</div>

<div class="speaker">
🕵️ MYSTERY JOURNEY
</div>

<div class="story-text">

Bienvenue.

Une histoire sombre vous attend.

Vos décisions auront des conséquences.
Certaines portes ne pourront plus être refermées.

Êtes-vous prêt à découvrir
ce qui se cache derrière le mystère ?

</div>

<div class="choices">

<button class="choice"
onclick="startGame()">
▶ Nouvelle partie
</button>

<button class="choice"
onclick="continueGame()">
💾 Continuer
</button>

</div>

</section>

</main>

<footer>

<div class="music">
<span>🎵</span>
<span>The Hollow Between</span>
</div>

</footer>

</div>

<audio
id="music"
loop
preload="auto">

<source
src="The Hollow Between.mp3"
type="audio/mpeg">

</audio>

<script>

const SAVE_KEY="mystery_journey_save";

const music=document.getElementById("music");

function startMusic(){

music.volume=.45;

const play=music.play();

if(play){
play.catch(()=>{});
}

}

document.addEventListener(
"click",
startMusic,
{once:true}
);

function startGame(){

localStorage.removeItem(SAVE_KEY);

window.location.href="game.html";

}

function continueGame(){

const save=
localStorage.getItem(SAVE_KEY);

if(save){

window.location.href="game.html";

}else{

startGame();

}

}

</script>

</body>
</html>

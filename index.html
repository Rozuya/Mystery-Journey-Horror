<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Mystery Journey: Horror</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

<header class="game-header">
<div>
<small>MYSTERY JOURNEY</small>
<h1>HORROR</h1>
</div>
</header>

<main>

<section class="story-box">

<div class="story-time">
UNE HISTOIRE COMMENCE...
</div>

<div class="speaker">
🕵️ MYSTERY JOURNEY
</div>

<div class="story-text">

Bienvenue.

Une histoire sombre vous attend.

Vos décisions auront des conséquences.
Certaines portes ne pourront plus être refermées.

Êtes-vous prêt à découvrir
ce qui se cache derrière le mystère ?

</div>

<div class="choices">

<button
class="choice"
id="newGameBtn">
▶ Nouvelle partie
</button>

<button
class="choice"
id="continueBtn">
💾 Continuer
</button>

</div>

</section>

</main>

<footer>

<div class="music">
<span>🎵</span>
<span>The Hollow Between</span>
</div>

</footer>

</div>

<audio
id="music"
loop
preload="auto">

<source
src="The Hollow Between.mp3"
type="audio/mpeg">

</audio>

<script>

/* =========================
   CONFIGURATION
========================= */

const SAVE_KEY =
"mystery_journey_horror_save_v1";

const music =
document.getElementById("music");


/* =========================
   MUSIQUE
========================= */

function startMusic(){

if(!music) return;

music.volume = 0.45;

const play =
music.play();

if(play){
play.catch(()=>{});
}

}

document.addEventListener(
"click",
startMusic,
{once:true}
);


/* =========================
   NOUVELLE PARTIE
========================= */

function startGame(){

/*
   IMPORTANT :
   On supprime UNIQUEMENT
   la vraie sauvegarde utilisée
   par save.js.
*/

try{

localStorage.removeItem(
SAVE_KEY
);

}catch(error){

console.error(
"Impossible de supprimer la sauvegarde",
error
);

}

/*
   On ouvre ensuite le jeu.

   Comme la sauvegarde vient d'être
   supprimée, game.js démarrera
   automatiquement au début.
*/

window.location.href =
"game.html";

}


/* =========================
   CONTINUER
========================= */

function continueGame(){

let save = null;

try{

save =
localStorage.getItem(
SAVE_KEY
);

}catch(error){

console.error(error);

}

/*
   Une sauvegarde existe :
   on la conserve et on continue.
*/

if(save){

window.location.href =
"game.html";

return;

}

/*
   Aucune sauvegarde :
   on commence une nouvelle partie.
*/

startGame();

}


/* =========================
   BOUTONS
========================= */

const newGameBtn =
document.getElementById(
"newGameBtn"
);

const continueBtn =
document.getElementById(
"continueBtn"
);

if(newGameBtn){

newGameBtn.addEventListener(
"click",
startGame
);

}

if(continueBtn){

continueBtn.addEventListener(
"click",
continueGame
);

}

</script>

</body>
</html>
